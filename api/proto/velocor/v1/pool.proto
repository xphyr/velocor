syntax = "proto3";

package velocor.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "velocor/v1/common.proto";

option go_package = "github.com/velocor/velocor/api/gen/go/velocor/v1;velocorv1";

// RaidLevel enumerates the md RAID levels supported for storage pools.
enum RaidLevel {
  RAID_LEVEL_UNSPECIFIED = 0;
  RAID_LEVEL_RAID0 = 1;
  RAID_LEVEL_RAID1 = 2;
  RAID_LEVEL_RAID10 = 3;
  RAID_LEVEL_RAID5F = 4;
}

// Pool aggregates one or more claimed Disks into an md array with an LVM thin pool on it.
message Pool {
  string id = 1;
  string name = 2;
  RaidLevel raid_level = 3;
  repeated string disk_ids = 4;
  uint32 strip_size_kb = 5;
  // The thin pool's chunk size (64 KiB).
  uint32 chunk_size_bytes = 6;
  // The md array's name.
  string array_name = 7;
  // The device the thin pool is on.
  string device = 8;
  string thin_pool_uuid = 9;
  string thin_pool_name = 10;
  uint64 total_bytes = 11;
  uint64 free_bytes = 12;
  uint64 allocated_bytes = 13;
  FilterPolicy filter_policy = 14;
  HealthStatus health_status = 15;
  google.protobuf.Timestamp created_at = 16;
}

message CreatePoolRequest {
  string name = 1;
  RaidLevel raid_level = 2;
  repeated string disk_ids = 3;
  uint32 strip_size_kb = 4;
  uint32 chunk_size_bytes = 5;
  FilterPolicy filter_policy = 6;
}

message CreatePoolResponse {
  Pool pool = 1;
}

message GetPoolRequest {
  string id = 1;
}

message GetPoolResponse {
  Pool pool = 1;
}

message ListPoolsRequest {}

message ListPoolsResponse {
  repeated Pool pools = 1;
}

message DeletePoolRequest {
  string id = 1;
}

message DeletePoolResponse {}

service PoolService {
  rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse) {
    option (google.api.http) = {
      post: "/api/v1/pools"
      body: "*"
    };
  }

  rpc GetPool(GetPoolRequest) returns (GetPoolResponse) {
    option (google.api.http) = {
      get: "/api/v1/pools/{id}"
    };
  }

  rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse) {
    option (google.api.http) = {
      get: "/api/v1/pools"
    };
  }

  rpc DeletePool(DeletePoolRequest) returns (DeletePoolResponse) {
    option (google.api.http) = {
      delete: "/api/v1/pools/{id}"
    };
  }
}
