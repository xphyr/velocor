name: Build, Test & Release Velocor

# Build logic lives in the Makefile; this workflow only decides what to call it with.
#  - pull requests: lint, unit + integration tests, the SPDK unit tests of our SPDK patches, and
#    a full image build pushed to a throwaway local registry (so the OS image build is exercised
#    too). Nothing is published. Only the jobs the changed files need run (hack/ci-changes.sh):
#    a chart- or docs-only change runs lint alone. Skipped jobs count as passed checks.
#  - main: images as sha-<sha> (+ moving tag "main"), signed and attested; dev Helm chart.
#  - v* tags: release images (vX.Y.Z, X.Y, latest), chart, CLI binaries, GitHub release.
# Every action is pinned to a commit SHA (hack/check-pins.sh enforces it) and every job gets
# only the permissions it needs. The Fedora base images follow Fedora's rolling release tag; each
# run resolves them once (BASE_PIN_DIR) and records the digests next to the image digests.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  # Which jobs this run needs. Pull requests: from the files they change. Everything else (main,
  # tags, manual runs): all of them, so what gets published is always fully tested.
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      go: ${{ steps.areas.outputs.go }}
      spdk: ${{ steps.areas.outputs.spdk }}
      images: ${{ steps.areas.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the changed files
        id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            git diff --name-only "$BASE...HEAD" | tee /dev/stderr | hack/ci-changes.sh | tee -a "$GITHUB_OUTPUT"
          else
            printf 'go=true\nspdk=true\nimages=true\n' | tee -a "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Pins (base images, Go toolchain, actions)
        run: make check-pins
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -no-color
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./internal/integration/
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          args: --build-tags integration
      - name: shellcheck
        run: make shellcheck
      - name: Alert rules (promtool check and unit tests)
        run: CONTAINER=docker make check-alerts
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: helm lint
        run: |
          helm lint deploy/charts/velocor-csi
          # The CDI StorageProfile hook renders only where CDI exists: render it explicitly.
          helm template velocor-csi deploy/charts/velocor-csi --api-versions cdi.kubevirt.io/v1beta1 |
            yq -e 'select(.kind == "Job") | .metadata.name' >/dev/null

  test:
    name: Unit & CSI sanity tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: make test
      - run: make build

  veloctl:
    name: veloctl binaries
    needs: [changes, lint, test]
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Cross-compile veloctl
        run: |
          mkdir -p dist
          VERSION="$(git describe --tags --always --dirty)"
          LDFLAGS="-s -w -X github.com/velocor/velocor/internal/version.Version=${VERSION} -X github.com/velocor/velocor/internal/version.Commit=$(git rev-parse --short=7 HEAD) -X github.com/velocor/velocor/internal/version.BuildTime=$(git log -1 --format=%cI)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            stage="$(mktemp -d)"; bin=veloctl; [[ "$GOOS" == windows ]] && bin=veloctl.exe
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$stage/$bin" ./cmd/veloctl
            cp README.md "$stage/"
            if [[ "$GOOS" == windows ]]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/veloctl-$GOOS-$GOARCH.zip" "$bin" README.md)
            else
              tar -C "$stage" -czf "dist/veloctl-$GOOS-$GOARCH.tar.gz" "$bin" README.md
            fi
          done
          ls -lh dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veloctl-binaries
          path: dist/*
          if-no-files-found: error

  # The kernel data plane's integration tests (TODO.md K-1/K-2) against real md, LVM thin,
  # device-mapper, nvmet and LIO on loop devices, as root, in a Fedora VM under the runner's
  # KVM (hack/kernel-tests-vm.sh): the runner's own Azure kernel has no installable extra
  # modules (dm-dust, nvmet, LIO), and the VM matches the appliance's kernel family and tools.
  # Not yet a gate for the images.
  kernel-tests:
    name: Kernel data plane tests
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: KVM and QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qy --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/velocor-kernel-tests
          key: fedora-cloud-${{ hashFiles('hack/kernel-tests-vm.sh') }}
      - run: make test-kernel-vm

  # SPDK's unit tests for the libraries our carried SPDK patches touch (deploy/containers/
  # spdk-patches): a separate SPDK compile with unit tests enabled. Images aren't published
  # unless they pass.
  spdk-unit-tests:
    name: SPDK patch unit tests
    needs: changes
    if: needs.changes.outputs.spdk == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make spdk-unit-tests

  # One job builds every image so the OS image embeds the spdk/velod images of this very run
  # (pinned by digest), and SPDK is compiled once for both the integration tests and the image.
  images:
    name: Images (integration tests, build, push)
    needs: [changes, lint, test, spdk-unit-tests]
    # Runs when the jobs before it passed or were skipped (not needed for this change).
    if: ${{ !cancelled() && !failure() && needs.changes.outputs.images == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Resolve each rolling Fedora base once for this run: the integration-tested SPDK image and
      # the pushed one then share one base and one SPDK compile.
      BASE_PIN_DIR: bin/base-pins
    permissions:
      contents: read
      packages: write     # push to ghcr.io (not used for pull requests)
      id-token: write     # keyless cosign signing and attestations
      attestations: write
    outputs:
      image_prefix: ${{ steps.vars.outputs.image_prefix }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Free disk space (SPDK build + bootc image)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Decide registry and tags
        id: vars
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # One credentials file for podman login, skopeo and the OS image build (which pulls the
          # just-pushed spdk/velod images, private while the repository is; a build secret).
          echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/registry-auth.json" >> "$GITHUB_ENV"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "$EVENT" == pull_request ]]; then
            prefix=localhost:5000/velocor; tag="pr-${PR}"; extra=""; release=false; insecure=true
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF_NAME}"; minor="$(cut -d. -f1,2 <<<"${v#v}")"
            prefix="$REGISTRY/$owner"; tag="$v"; extra="$minor latest"; release=true; insecure=false
            # A pre-release (v0.1.0-rc.1) gets only its own tag: "0.1" and "latest" stay on the
            # last final release.
            if [[ "$v" == *-* ]]; then extra=""; fi
          else
            prefix="$REGISTRY/$owner"; tag="sha-${GITHUB_SHA::7}"; extra="${GITHUB_REF_NAME//\//-}"; release=false; insecure=false
          fi
          {
            echo "image_prefix=$prefix"; echo "tag=$tag"; echo "extra=$extra"
            echo "release=$release"; echo "insecure=$insecure"
          } >> "$GITHUB_OUTPUT"

      - name: Throwaway registry (pull requests)
        if: github.event_name == 'pull_request'
        run: podman run -d --name registry -p 5000:5000 docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          podman login -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY" <<<"$TOKEN"
          docker login -u "$GITHUB_ACTOR" --password-stdin "$REGISTRY" <<<"$TOKEN"   # cosign, attest

      - name: Integration tests against real SPDK
        run: make test-integration

      - name: Build and push images
        env:
          IMAGE_PREFIX: ${{ steps.vars.outputs.image_prefix }}
          TAG: ${{ steps.vars.outputs.tag }}
          EXTRA_TAGS: ${{ steps.vars.outputs.extra }}
          RELEASE: ${{ steps.vars.outputs.release }}
          INSECURE_REGISTRY: ${{ steps.vars.outputs.insecure }}
        run: |
          args=(IMAGE_PREFIX="$IMAGE_PREFIX" TAG="$TAG" EXTRA_TAGS="$EXTRA_TAGS" RELEASE="$RELEASE"
                INSECURE_REGISTRY="$INSECURE_REGISTRY" "CSI_PLATFORMS=linux/amd64,linux/arm64")
          [[ "$RELEASE" == true ]] && args+=(VERSION="$TAG")
          make push "${args[@]}"
          {
            for f in bin/digests/velocor-*; do echo "$IMAGE_PREFIX/$(basename "$f")@$(cat "$f")  # $TAG"; done
            for f in "$BASE_PIN_DIR"/*; do echo "# base image $(basename "$f"): $(cat "$f")"; done
          } | tee bin/digests/refs.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests
          path: bin/digests/
          if-no-files-found: error

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        if: github.event_name != 'pull_request'
      - name: Sign images (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_PREFIX: ${{ steps.vars.outputs.image_prefix }}
        run: for n in velocor-spdk velocor-velod velocor-csi velocor-os; do cosign sign --yes "$IMAGE_PREFIX/$n@$(cat "bin/digests/$n")"; done

      # GitHub artifact attestations aren't available for private repositories owned by a user
      # ("Feature not available for user-owned private repositories"): they start once the
      # repository is public. Until then the images are only cosign-signed.
      - name: Read digests for attestations
        if: github.event_name != 'pull_request' && !github.event.repository.private
        id: digests
        run: for n in velocor-spdk velocor-velod velocor-csi velocor-os; do echo "${n#velocor-}=$(cat "bin/digests/$n")" >> "$GITHUB_OUTPUT"; done
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          subject-name: ${{ steps.vars.outputs.image_prefix }}/velocor-spdk
          subject-digest: ${{ steps.digests.outputs.spdk }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          subject-name: ${{ steps.vars.outputs.image_prefix }}/velocor-velod
          subject-digest: ${{ steps.digests.outputs.velod }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          subject-name: ${{ steps.vars.outputs.image_prefix }}/velocor-csi
          subject-digest: ${{ steps.digests.outputs.csi }}
          push-to-registry: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request' && !github.event.repository.private
        with:
          subject-name: ${{ steps.vars.outputs.image_prefix }}/velocor-os
          subject-digest: ${{ steps.digests.outputs.os }}
          push-to-registry: true

  helm:
    name: Helm chart
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # push the chart to ghcr.io (not for pull requests)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digests
          path: digests
      - name: Package (image pinned by digest)
        id: chart
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          chart=deploy/charts/velocor-csi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then ver="${GITHUB_REF_NAME#v}"; else ver="0.0.0-${TAG}"; fi
          yq -i ".image.repository = \"$IMAGE_PREFIX/velocor-csi\" | .image.tag = \"$TAG\" | .image.digest = \"$(cat digests/velocor-csi)\"" "$chart/values.yaml"
          helm lint "$chart"
          mkdir -p dist && helm package "$chart" --version "$ver" --app-version "$TAG" -d dist
          echo "pkg=$(ls dist/velocor-csi-*.tgz)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velocor-csi-chart
          path: dist/velocor-csi-*.tgz
          if-no-files-found: error
      - name: Push chart to ghcr.io
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ steps.chart.outputs.pkg }}
        run: |
          helm registry login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"
          helm push "$PKG" "oci://$REGISTRY/${GITHUB_REPOSITORY_OWNER,,}/charts"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [veloctl, images, helm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # keyless signing of checksums
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: veloctl-binaries
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velocor-csi-chart
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-digests
          path: digests
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          path: .
          format: spdx-json
          output-file: dist/velocor-sbom.spdx.json
      - name: Manifests (images pinned by digest) and checksums
        id: rel
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
          TAG: ${{ needs.images.outputs.tag }}
        run: |
          csi="$IMAGE_PREFIX/velocor-csi@$(cat digests/velocor-csi)"
          sed -E "s|image: \S+/velocor-csi:\S+|image: $csi|" deploy/k8s/csi/velocor-csi.yaml > dist/velocor-csi.yaml
          grep -q "image: $csi" dist/velocor-csi.yaml
          cp deploy/k8s/csi/volumesnapshotclass.yaml deploy/k8s/csi/volumegroupsnapshotclass.yaml dist/
          cp digests/refs.txt dist/images.txt
          (cd dist && sha256sum -- veloctl-* velocor-csi-*.tgz ./*.yaml images.txt velocor-sbom.spdx.json > checksums.txt)
          echo "chart_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      - name: Sign checksums.txt (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }} # see the images job
        with:
          subject-path: |
            dist/veloctl-*.tar.gz
            dist/veloctl-*.zip
            dist/velocor-csi-*.tgz
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          # v0.1.0-rc.1 and the like: a pre-release, never shown as the latest release.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            dist/veloctl-*
            dist/velocor-csi-*.tgz
            dist/velocor-csi.yaml
            dist/volumesnapshotclass.yaml
            dist/volumegroupsnapshotclass.yaml
            dist/images.txt
            dist/velocor-sbom.spdx.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          body: |
            ## Images

            Signed with Sigstore cosign (keyless) and attested (SLSA provenance). `images.txt`
            lists every image pinned by digest (deploy by digest, not by tag) and the Fedora base
            images this release was built on (also in each image's
            `org.opencontainers.image.base.*` labels).

            - Appliance OS (bootc): `${{ needs.images.outputs.image_prefix }}/velocor-os:${{ needs.images.outputs.tag }}`
            - Kubernetes CSI driver: `${{ needs.images.outputs.image_prefix }}/velocor-csi:${{ needs.images.outputs.tag }}`
            - velod and spdk_tgt are embedded in the OS image; they are not deployed separately.

            ## CSI driver

            ```bash
            helm install velocor-csi oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/velocor-csi \
              --version ${{ steps.rel.outputs.chart_version }} --namespace velocor-csi --create-namespace
            ```

            ## Verifying

            Needs cosign v3 or later (v2 can't read these signatures). `gh attestation verify`
            checks the SLSA provenance of the binaries, the chart and the images.

            ```bash
            cosign verify-blob --bundle checksums.txt.sigstore.json \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
            ```
