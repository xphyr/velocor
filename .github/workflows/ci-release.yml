name: Build, Test & Release Velocor

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    name: Test & Verify Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run unit & CSI sanity tests
        run: make test

      - name: Build all binaries (velod, veloctl, velocor-csi)
        run: make build

  build-cli:
    name: Build veloctl CLI Release Binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile veloctl and package archives
        run: |
          set -euo pipefail
          mkdir -p dist

          VERSION="$(git describe --tags --always --dirty 2>/dev/null || echo 'v0.1.0-dev')"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo 'none')"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          LDFLAGS="-s -w -X github.com/velocor/velocor/internal/version.Version=${VERSION} -X github.com/velocor/velocor/internal/version.Commit=${COMMIT} -X github.com/velocor/velocor/internal/version.BuildTime=${BUILD_TIME}"

          TARGETS=(
            "linux:amd64"
            "linux:arm64"
            "darwin:amd64"
            "darwin:arm64"
            "windows:amd64"
          )

          for target in "${TARGETS[@]}"; do
            GOOS="${target%%:*}"
            GOARCH="${target##*:}"
            STAGE_DIR="$(mktemp -d)"
            BIN_NAME="veloctl"
            if [[ "${GOOS}" == "windows" ]]; then
              BIN_NAME="veloctl.exe"
            fi

            echo "Building ${BIN_NAME} for ${GOOS}/${GOARCH} (${VERSION})..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags "${LDFLAGS}" -o "${STAGE_DIR}/${BIN_NAME}" ./cmd/veloctl

            cp README.md "${STAGE_DIR}/"

            if [[ "${GOOS}" == "windows" ]]; then
              (cd "${STAGE_DIR}" && zip -q "${GITHUB_WORKSPACE}/dist/veloctl-${GOOS}-${GOARCH}.zip" "${BIN_NAME}" README.md)
            else
              tar -C "${STAGE_DIR}" -czf "${GITHUB_WORKSPACE}/dist/veloctl-${GOOS}-${GOARCH}.tar.gz" "${BIN_NAME}" README.md
            fi
            rm -rf "${STAGE_DIR}"
          done

          (cd dist && sha256sum veloctl-* > checksums.txt)
          ls -lh dist/

      - name: Upload veloctl release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: veloctl-binaries
          path: dist/*
          if-no-files-found: error

  build-containers:
    name: Build Container (${{ matrix.image }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: velocor-velod
            containerfile: deploy/containers/Containerfile.velod
          - image: velocor-spdk
            containerfile: deploy/containers/Containerfile.spdk
          - image: velocor-csi
            containerfile: deploy/containers/Containerfile.csi
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve build version metadata
        id: vars
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          VERSION="$(git describe --tags --always 2>/dev/null || echo 'v0.1.0-dev')"
          COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo 'none')"
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "owner_lc=${OWNER_LC}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.containerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}
            BUILD_TIME=${{ steps.vars.outputs.build_time }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4

      - name: Sign ${{ matrix.image }} image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST}"

  build-os:
    name: Build Bootc Appliance OS (velocor-os)
    needs:
      - build-cli
      - build-containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download veloctl linux-amd64 binary for OS image
        uses: actions/download-artifact@v7
        with:
          name: veloctl-binaries
          path: /tmp/veloctl-dist

      - name: Prepare velod-bin build context and Quadlet image references
        id: vars
        run: |
          mkdir -p /tmp/velod-rootfs/usr/bin
          tar -xzf /tmp/veloctl-dist/veloctl-linux-amd64.tar.gz -C /tmp/velod-rootfs/usr/bin veloctl
          chmod 0755 /tmp/velod-rootfs/usr/bin/veloctl

          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            QUADLET_TAG="${GITHUB_REF_NAME}"
          else
            QUADLET_TAG="latest"
          fi
          echo "owner_lc=${OWNER_LC}" >> "${GITHUB_OUTPUT}"
          echo "velod_image=${REGISTRY}/${OWNER_LC}/velocor-velod:${QUADLET_TAG}" >> "${GITHUB_OUTPUT}"
          echo "spdk_image=${REGISTRY}/${OWNER_LC}/velocor-spdk:${QUADLET_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for velocor-os
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/velocor-os
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern=v{{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push velocor-os (bootc)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/bootc/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || false }}
          build-contexts: |
            velod-bin=/tmp/velod-rootfs
          build-args: |
            VELOCTL_FROM=velod-bin
            VELOD_IMAGE=${{ steps.vars.outputs.velod_image }}
            SPDK_IMAGE=${{ steps.vars.outputs.spdk_image }}
          cache-from: type=gha,scope=velocor-os
          cache-to: type=gha,mode=max,scope=velocor-os

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4

      - name: Sign velocor-os image with Cosign (keyless)
        if: github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner_lc }}/velocor-os@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE_DIGEST}"

  build-helm:
    name: Lint, Package & Push CSI Helm Chart
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Lint and package velocor-csi chart
        id: chart
        run: |
          set -euo pipefail
          mkdir -p dist
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          CHART_DIR="deploy/charts/velocor-csi"

          helm lint "${CHART_DIR}"
          sed -i "s|repository: ghcr.io/velocor/velocor-csi|repository: ${REGISTRY}/${OWNER_LC}/velocor-csi|g" "${CHART_DIR}/values.yaml"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            CHART_VER="${GITHUB_REF_NAME#v}"
            APP_VER="${GITHUB_REF_NAME}"
          else
            CHART_VER="0.1.0-dev+${GITHUB_SHA::7}"
            APP_VER="latest"
          fi

          helm package "${CHART_DIR}" --version "${CHART_VER}" --app-version "${APP_VER}" -d dist
          CHART_PKG="$(ls dist/velocor-csi-*.tgz)"
          echo "owner_lc=${OWNER_LC}" >> "${GITHUB_OUTPUT}"
          echo "chart_pkg=${CHART_PKG}" >> "${GITHUB_OUTPUT}"

      - name: Upload Helm chart artifact
        uses: actions/upload-artifact@v6
        with:
          name: velocor-csi-chart
          path: dist/velocor-csi-*.tgz
          if-no-files-found: error

      - name: Push Helm chart to GHCR OCI registry
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | helm registry login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin
          helm push "${{ steps.chart.outputs.chart_pkg }}" "oci://${REGISTRY}/${{ steps.chart.outputs.owner_lc }}/charts"

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - test
      - build-cli
      - build-containers
      - build-os
      - build-helm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download veloctl release binaries
        uses: actions/download-artifact@v7
        with:
          name: veloctl-binaries
          path: dist

      - name: Download CSI Helm chart
        uses: actions/download-artifact@v7
        with:
          name: velocor-csi-chart
          path: dist

      - name: Generate repository & binary SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/velocor-sbom.spdx.json

      - name: Package Kubernetes CSI manifests and checksums
        id: meta
        run: |
          OWNER_LC="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          TAG="${GITHUB_REF_NAME}"
          CSI_IMAGE="${REGISTRY}/${OWNER_LC}/velocor-csi:${TAG}"

          sed "s|image: registry.xphyrlab.net/velocor/velocor-csi:latest|image: ${CSI_IMAGE}|g" \
            deploy/k8s/csi/velocor-csi.yaml > dist/velocor-csi.yaml
          cp deploy/k8s/csi/volumesnapshotclass.yaml dist/volumesnapshotclass.yaml
          cp deploy/k8s/csi/volumegroupsnapshotclass.yaml dist/volumegroupsnapshotclass.yaml

          (cd dist && sha256sum veloctl-* velocor-csi-*.tgz *.yaml velocor-sbom.spdx.json > checksums.txt)
          echo "owner_lc=${OWNER_LC}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "chart_ver=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign checksums.txt with Cosign (keyless)
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      - name: Attest SLSA build provenance for CLI and Helm chart
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/veloctl-*.tar.gz
            dist/veloctl-*.zip
            dist/velocor-csi-*.tgz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/veloctl-*
            dist/velocor-csi-*.tgz
            dist/velocor-csi.yaml
            dist/volumesnapshotclass.yaml
            dist/volumegroupsnapshotclass.yaml
            dist/velocor-sbom.spdx.json
            dist/checksums.txt
            dist/checksums.txt.sigstore.json
          body: |
            ## Container & Bootc OS Images (`${{ steps.meta.outputs.tag }}`)

            All container images are signed with Sigstore Cosign (keyless OIDC) and include BuildKit SBOM & SLSA provenance attestations.

            - **Appliance OS (`bootc`)**: `${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/velocor-os:${{ steps.meta.outputs.tag }}`
            - **Control Plane (`velod`)**: `${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/velocor-velod:${{ steps.meta.outputs.tag }}`
            - **Data Plane (`spdk_tgt`)**: `${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/velocor-spdk:${{ steps.meta.outputs.tag }}`
            - **Kubernetes CSI Driver (`velocor-csi`)**: `${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/velocor-csi:${{ steps.meta.outputs.tag }}`

            ## Kubernetes CSI Driver (Helm & Manifests)

            Install via Helm OCI chart:
            ```bash
            helm install velocor-csi oci://${{ env.REGISTRY }}/${{ steps.meta.outputs.owner_lc }}/charts/velocor-csi --version ${{ steps.meta.outputs.chart_ver }} --namespace velocor-csi --create-namespace
            ```

            Or deploy with raw manifests:
            ```bash
            kubectl apply -f https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/velocor-csi.yaml
            ```

            ## Verification (Cosign & SBOM)

            Verify `checksums.txt` using Sigstore Cosign:
            ```bash
            cosign verify-blob --bundle checksums.txt.sigstore.json --certificate-identity-regexp "https://github.com/${{ github.repository }}/" --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
            ```
