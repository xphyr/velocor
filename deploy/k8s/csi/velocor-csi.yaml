apiVersion: v1
kind: Namespace
metadata:
  name: velocor-csi
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.velocor.io
spec:
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velocor-csi-controller
  namespace: velocor-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velocor-csi-controller-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments", "volumeattachments/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshotcontents", "volumesnapshotcontents/status", "volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses", "volumegroupsnapshotcontents", "volumegroupsnapshotcontents/status", "volumegroupsnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velocor-csi-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velocor-csi-controller-role
subjects:
  - kind: ServiceAccount
    name: velocor-csi-controller
    namespace: velocor-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocor-csi-controller
  namespace: velocor-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocor-csi-controller
  template:
    metadata:
      labels:
        app: velocor-csi-controller
    spec:
      serviceAccountName: velocor-csi-controller
      containers:
        - name: velocor-csi
          image: ghcr.io/xphyr/velocor-csi:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
          envFrom:
            - secretRef:
                name: velocor-csi-auth
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.0@sha256:6ebe60fd8ed67a7f8a90d34402e9e706b274e53612d6fa5fbb8285728db622e2
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=false
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.13.0@sha256:d1a26170efed45491074ca4545c81844eee2b9043fb885ac01fb4aed6f8b72d2
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.3.0@sha256:48fb3deb93cd848e3c8998b6368f4322c93bb5ce4a90d1307b6dda0dbefb9a0e
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.0@sha256:b03d3334f8035fa42660b166f6eb819a659a14774da020eb1b6c52cd422eaadb
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        # Changed-block tracking (off): add --snapshot-metadata to the velocor-csi container,
        # uncomment this sidecar, mount a TLS secret at /certs, and create a Service and a
        # SnapshotMetadataService for it (the Helm chart's snapshotMetadata.enabled does all of
        # that; see TODO.md L-2).
        # - name: csi-snapshot-metadata
        #   image: registry.k8s.io/sig-storage/csi-snapshot-metadata:v1.1.0@sha256:8069b3bc03f21fe804f6f362c26037598b9f947a9e3e9d60336988ca7c07f61e
        #   args: [--csi-address=/csi/csi.sock, --tls-cert=/certs/tls.crt, --tls-key=/certs/tls.key]
      volumes:
        - name: socket-dir
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velocor-csi-node
  namespace: velocor-csi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: velocor-csi-node
  namespace: velocor-csi
spec:
  selector:
    matchLabels:
      app: velocor-csi-node
  template:
    metadata:
      labels:
        app: velocor-csi-node
    spec:
      serviceAccountName: velocor-csi-node
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: velocor-csi
          image: ghcr.io/xphyr/velocor-csi:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev-dir
              mountPath: /dev
            - name: etc-iscsi
              mountPath: /etc/iscsi
            - name: var-lib-iscsi
              mountPath: /var/lib/iscsi
            - name: etc-nvme
              mountPath: /etc/nvme
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.0@sha256:b7fefd08651f00ac4df1a196ed4c621c2451fbb899297fe9fad9e36c667af0c0
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.velocor.io/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.velocor.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: dev-dir
          hostPath:
            path: /dev
            type: Directory
        - name: etc-iscsi
          hostPath:
            path: /etc/iscsi
            type: DirectoryOrCreate
        - name: var-lib-iscsi
          hostPath:
            path: /var/lib/iscsi
            type: DirectoryOrCreate
        - name: etc-nvme
          hostPath:
            path: /etc/nvme
            type: DirectoryOrCreate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: velocor-nvme-tcp
provisioner: csi.velocor.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  protocol: NVMEOF_TCP
  thin: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: velocor-iscsi
provisioner: csi.velocor.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  protocol: ISCSI
  thin: "true"
