apiVersion: v1
kind: Namespace
metadata:
  name: velocor-csi
---
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: csi.velocor.io
spec:
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velocor-csi-controller
  namespace: velocor-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velocor-csi-controller-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes", "volumeattachments", "volumeattachments/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshotcontents", "volumesnapshotcontents/status", "volumesnapshots"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["groupsnapshot.storage.k8s.io"]
    resources: ["volumegroupsnapshotclasses", "volumegroupsnapshotcontents", "volumegroupsnapshotcontents/status", "volumegroupsnapshots"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velocor-csi-controller-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velocor-csi-controller-role
subjects:
  - kind: ServiceAccount
    name: velocor-csi-controller
    namespace: velocor-csi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocor-csi-controller
  namespace: velocor-csi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velocor-csi-controller
  template:
    metadata:
      labels:
        app: velocor-csi-controller
    spec:
      serviceAccountName: velocor-csi-controller
      containers:
        - name: velocor-csi
          image: ghcr.io/xphyr/velocor-csi:latest
          imagePullPolicy: IfNotPresent
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
          envFrom:
            - secretRef:
                name: velocor-csi-auth
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=false
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.13.1@sha256:b398d0f5a30202b5261412023b24057bc5a493d8b2b5dad25ebf5c89966e1559
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.3.1@sha256:d5b040c2f6ffb25127169feeb845aaf1fa3279e510d71fbebe386b5becc625cc
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.1@sha256:b534b99edb61a5f95e297da8e2a133d36e27ad098e2f643393986e86f093d425
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election=false
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
        # Changed-block tracking (off): add --snapshot-metadata to the velocor-csi container,
        # uncomment this sidecar, mount a TLS secret at /certs, and create a Service and a
        # SnapshotMetadataService for it (the Helm chart's snapshotMetadata.enabled does all of
        # that; see docs/review-history.md L-2).
        # - name: csi-snapshot-metadata
        #   image: registry.k8s.io/sig-storage/csi-snapshot-metadata:v1.2.0@sha256:e54a3e0570836e867b3c12bd7b274f90f281e4822c717b05fa5ce267c1e30d7a
        #   args: [--csi-address=/csi/csi.sock, --tls-cert=/certs/tls.crt, --tls-key=/certs/tls.key]
      volumes:
        - name: socket-dir
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: velocor-csi-node
  namespace: velocor-csi
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: velocor-csi-node
  namespace: velocor-csi
spec:
  selector:
    matchLabels:
      app: velocor-csi-node
  template:
    metadata:
      labels:
        app: velocor-csi-node
    spec:
      serviceAccountName: velocor-csi-node
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: velocor-csi
          image: ghcr.io/xphyr/velocor-csi:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN"]
            allowPrivilegeEscalation: true
          args:
            - --mode=node
            - --endpoint=unix:///csi/csi.sock
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              mountPropagation: Bidirectional
            - name: dev-dir
              mountPath: /dev
            - name: etc-iscsi
              mountPath: /etc/iscsi
            - name: var-lib-iscsi
              mountPath: /var/lib/iscsi
            - name: etc-nvme
              mountPath: /etc/nvme
        - name: csi-node-driver-registrar
          image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path=/var/lib/kubelet/plugins/csi.velocor.io/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
      volumes:
        - name: socket-dir
          hostPath:
            path: /var/lib/kubelet/plugins/csi.velocor.io
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: /var/lib/kubelet/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: dev-dir
          hostPath:
            path: /dev
            type: Directory
        - name: etc-iscsi
          hostPath:
            path: /etc/iscsi
            type: DirectoryOrCreate
        - name: var-lib-iscsi
          hostPath:
            path: /var/lib/iscsi
            type: DirectoryOrCreate
        - name: etc-nvme
          hostPath:
            path: /etc/nvme
            type: DirectoryOrCreate
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: velocor-nvme-tcp
provisioner: csi.velocor.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  protocol: NVMEOF_TCP
  thin: "true"
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: velocor-iscsi
provisioner: csi.velocor.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  protocol: ISCSI
  thin: "true"
