# Velocor: the host's own LVM sees only md arrays (velod's pools) and activates nothing by
# itself; velod activates its volume groups (internal/dataplane/kernelplane, Settle). Exported
# volumes hold clients' data, which can include their own LVM: never scanned or activated here.
devices {
	use_devicesfile = 0
	global_filter = [ "a|^/dev/md|", "r|.*|" ]
}
activation {
	auto_activation_volume_list = []
}
