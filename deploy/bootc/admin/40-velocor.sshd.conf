# Velocor appliance SSH policy. Sorts before Fedora's 50-redhat.conf, and the first value wins.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
# Keys can be provisioned without the user's home directory existing yet (for example into a
# disk image before first boot): /etc/ssh/authorized_keys.d/<user>, root-owned.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u
