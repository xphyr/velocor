driverName: csi.velocor.io

image:
  repository: ghcr.io/xphyr/velocor-csi
  tag: "" # Defaults to Chart.appVersion
  # sha256:... pins the image (used instead of the tag); release charts set it.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Velocor API authentication
auth:
  # Name of an existing Secret containing VELOCOR_ENDPOINT, VELOCOR_TOKEN and optionally
  # VELOCOR_CA_CERT / VELOCOR_INSECURE. If empty and endpoint/token are provided, the chart
  # creates a Secret automatically.
  existingSecret: ""
  secretName: velocor-csi-auth
  endpoint: ""
  token: ""
  # PEM certificate used to verify the Velocor API. For the appliance's self-signed
  # certificate, paste the contents of /var/lib/velocor/tls.crt.
  caCert: ""
  # Skip TLS verification entirely. Exposes the API token to anyone on the path; lab use only.
  insecure: "false"
  # Deprecated: one IP:port every node connects to instead of the portals' own addresses
  # (NAT'd labs). Use portals / defaultPortals instead.
  portalOverride: ""

# Velocor portals (names or IDs, comma-separated; either protocol) that volumes of classes
# without their own "portals" are exported on. Nodes connect to every one (NVMe/TCP native
# multipath; iSCSI uses the first that answers). If neither is set and the appliance has more
# than one portal of a class's protocol, provisioning is refused rather than guessed.
# Unlike a class's portals, this can be changed later and applies to existing volumes at
# their next attach.
defaultPortals: ""

controller:
  replicas: 1
  leaderElection: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

node:
  kubeletDir: /var/lib/kubelet
  resources: {}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}

sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
    resources: {}
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.7.0
    resources: {}
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
    resources: {}
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.1.0
    resources: {}
  nodeDriverRegistrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0
    resources: {}

storageClasses:
  nvmeTcp:
    enabled: true
    name: velocor-nvme-tcp
    isDefault: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    thin: "true"
    pool: ""
    fsType: ext4
    # Portals for this class's volumes (names or IDs, comma-separated); empty uses
    # defaultPortals. StorageClass parameters can't be changed in place: changing this on an
    # existing class means deleting the class first (its volumes keep working).
    portals: ""
  iscsi:
    enabled: true
    name: velocor-iscsi
    isDefault: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    thin: "true"
    pool: ""
    fsType: ext4
    # Portals for this class's volumes (names or IDs, comma-separated); empty uses
    # defaultPortals. StorageClass parameters can't be changed in place: changing this on an
    # existing class means deleting the class first (its volumes keep working).
    portals: ""

snapshots:
  volumeSnapshotClass:
    enabled: true
    name: velocor-snapshots
    deletionPolicy: Delete
    isDefault: false
  volumeGroupSnapshotClass:
    # "auto" enables when groupsnapshot.storage.k8s.io/v1beta1 CRD exists; true/false forces on/off
    enabled: auto
    name: velocor-group-snapshots
    deletionPolicy: Delete
  sidecar:
    # "auto" enables --enable-volume-group-snapshots=true when groupsnapshot.storage.k8s.io/v1beta1 CRD exists
    groupSnapshotsEnabled: auto

# KubeVirt CDI StorageProfile for each Velocor StorageClass: what CDI asks for when it makes a
# VM disk (DataVolume). CDI creates the profiles but fills them in only for drivers it knows, so
# a Helm hook Job patches these settings in after every install and upgrade (which also restores
# a profile that CDI reset because its StorageClass was recreated).
cdi:
  storageProfile:
    # "auto": only when CDI (cdi.kubevirt.io/v1beta1) is installed; true/false forces it.
    enabled: auto
    # In order of preference. ReadWriteMany raw block comes first: it's what a VM needs to
    # live-migrate. A ReadWriteMany filesystem isn't offered (the driver refuses it).
    claimPropertySets:
      - accessModes: [ReadWriteMany]
        volumeMode: Block
      - accessModes: [ReadWriteOnce]
        volumeMode: Block
      - accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
    # Clones are made by the driver (thin lvol clones); no data is copied.
    cloneStrategy: csi-clone
    # Golden images from DataImportCrons are kept as snapshots; VM disks are clones of them.
    dataImportCronSourceFormat: snapshot

openshift:
  scc:
    # "auto" binds the OpenShift privileged SCC to velocor-csi-node when security.openshift.io/v1 is present
    enabled: auto
