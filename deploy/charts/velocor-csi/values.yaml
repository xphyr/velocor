driverName: csi.velocor.io

image:
  repository: ghcr.io/xphyr/velocor-csi
  tag: "" # Defaults to Chart.appVersion
  # sha256:... pins the image (used instead of the tag); release charts set it.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Velocor API authentication
auth:
  # Name of an existing Secret containing VELOCOR_ENDPOINT, VELOCOR_TOKEN and optionally
  # VELOCOR_CA_CERT / VELOCOR_INSECURE. If empty and endpoint/token are provided, the chart
  # creates a Secret automatically.
  existingSecret: ""
  secretName: velocor-csi-auth
  endpoint: ""
  token: ""
  # PEM certificate used to verify the Velocor API. For the appliance's self-signed
  # certificate, paste the contents of /var/lib/velocor/tls.crt.
  caCert: ""
  # Skip TLS verification entirely. Exposes the API token to anyone on the path; lab use only.
  insecure: "false"
  # Deprecated: one IP:port every node connects to instead of the portals' own addresses
  # (NAT'd labs). Use portals / defaultPortals instead.
  portalOverride: ""

# Velocor portals (names or IDs, comma-separated; either protocol) that volumes of classes
# without their own "portals" are exported on. Nodes connect to every one (NVMe/TCP native
# multipath; iSCSI uses the first that answers). If neither is set and the appliance has more
# than one portal of a class's protocol, provisioning is refused rather than guessed.
# Unlike a class's portals, this can be changed later and applies to existing volumes at
# their next attach.
defaultPortals: ""

controller:
  replicas: 1
  leaderElection: false
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

node:
  kubeletDir: /var/lib/kubelet
  resources: {}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}

# CSI sidecars, pinned by digest. Change them together and test on an arm64 and an x86_64
# cluster: CI only renders the chart. csi-snapshotter v8.7+ always serves group snapshots
# (GA, groupsnapshot.storage.k8s.io/v1); it has no flag for them any more.
sidecars:
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v6.4.1@sha256:9e76a2c599ffd7a66f08feeb62ddec61e3545eaa442f8f8f6a495569c0b06829
    resources: {}
  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.13.1@sha256:b398d0f5a30202b5261412023b24057bc5a493d8b2b5dad25ebf5c89966e1559
    resources: {}
  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v2.3.1@sha256:d5b040c2f6ffb25127169feeb845aaf1fa3279e510d71fbebe386b5becc625cc
    resources: {}
  snapshotter:
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.7.1@sha256:b534b99edb61a5f95e297da8e2a133d36e27ad098e2f643393986e86f093d425
    resources: {}
  nodeDriverRegistrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.18.1@sha256:f847fb218cdf1d0f0fa79772ca6f46e11d25635eb49c06efb5dccd00b5245ef5
    resources: {}

# Changed-block tracking for incremental backups (CSI SnapshotMetadata, KEP-3314; docs/review-history.md L-2).
# Off by default. Needs the cluster's SnapshotMetadataService CRD (cbt.storage.k8s.io/v1beta1, installed from
# kubernetes-csi/external-snapshot-metadata, like the VolumeSnapshot CRDs), and a TLS
# certificate for the sidecar's service. The sidecar is pinned like the others above.
snapshotMetadata:
  enabled: false
  image: registry.k8s.io/sig-storage/csi-snapshot-metadata:v1.2.0@sha256:e54a3e0570836e867b3c12bd7b274f90f281e4822c717b05fa5ce267c1e30d7a
  resources: {}
  # Secret with tls.crt and tls.key, valid for velocor-csi-snapshot-metadata.<namespace>.svc.
  # Empty: on OpenShift the service CA issues one; elsewhere it is required.
  tlsSecretName: ""
  # PEM CA certificate that issued it, given to backup clients through the
  # SnapshotMetadataService. Empty: on OpenShift the service CA bundle.
  caCert: ""
  # Audience backup clients' tokens must be issued for. Empty: the driver name.
  audience: ""

storageClasses:
  nvmeTcp:
    enabled: true
    name: velocor-nvme-tcp
    isDefault: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    # Volumes are always thin: kept because a StorageClass's parameters can't be changed by an upgrade.
    thin: "true"
    pool: ""
    fsType: ext4
    # Portals for this class's volumes (names or IDs, comma-separated); empty uses
    # defaultPortals. StorageClass parameters can't be changed in place: changing this on an
    # existing class means deleting the class first (its volumes keep working).
    portals: ""
  iscsi:
    enabled: true
    name: velocor-iscsi
    isDefault: false
    reclaimPolicy: Delete
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    thin: "true"
    pool: ""
    fsType: ext4
    # Portals for this class's volumes (names or IDs, comma-separated); empty uses
    # defaultPortals. StorageClass parameters can't be changed in place: changing this on an
    # existing class means deleting the class first (its volumes keep working).
    portals: ""

snapshots:
  volumeSnapshotClass:
    enabled: true
    name: velocor-snapshots
    deletionPolicy: Delete
    isDefault: false
  volumeGroupSnapshotClass:
    # "auto" enables when the cluster serves groupsnapshot.storage.k8s.io (v1, else v1beta1);
    # true/false forces on/off (forced on without the CRDs, it's created as v1)
    enabled: auto
    name: velocor-group-snapshots
    deletionPolicy: Delete

# KubeVirt CDI StorageProfile for each Velocor StorageClass: what CDI asks for when it makes a
# VM disk (DataVolume). CDI creates the profiles but fills them in only for drivers it knows, so
# a Helm hook Job patches these settings in after every install and upgrade (which also restores
# a profile that CDI reset because its StorageClass was recreated).
cdi:
  storageProfile:
    # "auto": only when CDI (cdi.kubevirt.io/v1beta1) is installed; true/false forces it.
    enabled: auto
    # In order of preference. ReadWriteMany raw block comes first: it's what a VM needs to
    # live-migrate. A ReadWriteMany filesystem isn't offered (the driver refuses it).
    claimPropertySets:
      - accessModes: [ReadWriteMany]
        volumeMode: Block
      - accessModes: [ReadWriteOnce]
        volumeMode: Block
      - accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
    # Clones are made by the driver (thin clones); no data is copied.
    cloneStrategy: csi-clone
    # Golden images from DataImportCrons are kept as snapshots; VM disks are clones of them.
    dataImportCronSourceFormat: snapshot

openshift:
  scc:
    # "auto" binds the OpenShift privileged SCC to velocor-csi-node when security.openshift.io/v1 is present
    enabled: auto
