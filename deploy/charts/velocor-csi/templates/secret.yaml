{{- if and (not .Values.auth.existingSecret) (or .Values.auth.endpoint .Values.auth.token) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "velocor-csi.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "velocor-csi.labels" . | nindent 4 }}
type: Opaque
stringData:
  VELOCOR_ENDPOINT: {{ .Values.auth.endpoint | quote }}
  VELOCOR_TOKEN: {{ .Values.auth.token | quote }}
  VELOCOR_INSECURE: {{ .Values.auth.insecure | quote }}
{{- end }}
