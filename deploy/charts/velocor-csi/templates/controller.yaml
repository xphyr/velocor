apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocor-csi-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "velocor-csi.labels" . | nindent 4 }}
    app: velocor-csi-controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: velocor-csi-controller
  template:
    metadata:
      labels:
        app: velocor-csi-controller
        {{- include "velocor-csi.labels" . | nindent 8 }}
    spec:
      serviceAccountName: velocor-csi-controller
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: velocor-csi
          image: {{ include "velocor-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=controller
            - --endpoint=unix:///csi/csi.sock
            - --driver-name={{ .Values.driverName }}
            {{- if .Values.snapshotMetadata.enabled }}
            - --snapshot-metadata
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "velocor-csi.secretName" . }}
          {{- if or .Values.auth.portalOverride .Values.defaultPortals }}
          env:
            {{- if .Values.auth.portalOverride }}
            - name: VELOCOR_PORTAL_OVERRIDE
              value: {{ .Values.auth.portalOverride | quote }}
            {{- end }}
            {{- if .Values.defaultPortals }}
            - name: VELOCOR_DEFAULT_PORTALS
              value: {{ .Values.defaultPortals | quote }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- with .Values.controller.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-provisioner
          image: {{ .Values.sidecars.provisioner.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --feature-gates=Topology=false
            - --leader-election={{ .Values.controller.leaderElection }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- with .Values.sidecars.provisioner.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-attacher
          image: {{ .Values.sidecars.attacher.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election={{ .Values.controller.leaderElection }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- with .Values.sidecars.attacher.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-resizer
          image: {{ .Values.sidecars.resizer.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election={{ .Values.controller.leaderElection }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- with .Values.sidecars.resizer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        - name: csi-snapshotter
          image: {{ .Values.sidecars.snapshotter.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --leader-election={{ .Values.controller.leaderElection }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          {{- with .Values.sidecars.snapshotter.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.snapshotMetadata.enabled }}
        - name: csi-snapshot-metadata
          image: {{ .Values.snapshotMetadata.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --tls-cert=/certs/tls.crt
            - --tls-key=/certs/tls.key
          ports:
            - name: metadata
              containerPort: 50051
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: snapshot-metadata-certs
              mountPath: /certs
              readOnly: true
          {{- with .Values.snapshotMetadata.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- if .Values.snapshotMetadata.enabled }}
        - name: snapshot-metadata-certs
          secret:
            secretName: {{ include "velocor-csi.snapshotMetadataTLSSecret" . }}
        {{- end }}
