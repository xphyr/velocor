{{- if .Values.snapshots.volumeSnapshotClass.enabled }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.snapshots.volumeSnapshotClass.name }}
  labels:
    {{- include "velocor-csi.labels" . | nindent 4 }}
  {{- if .Values.snapshots.volumeSnapshotClass.isDefault }}
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
  {{- end }}
driver: {{ .Values.driverName }}
deletionPolicy: {{ .Values.snapshots.volumeSnapshotClass.deletionPolicy }}
{{- end }}
{{- if .Values.snapshots.volumeGroupSnapshotClass.enabled }}
---
apiVersion: groupsnapshot.storage.k8s.io/v1beta1
kind: VolumeGroupSnapshotClass
metadata:
  name: {{ .Values.snapshots.volumeGroupSnapshotClass.name }}
  labels:
    {{- include "velocor-csi.labels" . | nindent 4 }}
driver: {{ .Values.driverName }}
deletionPolicy: {{ .Values.snapshots.volumeGroupSnapshotClass.deletionPolicy }}
{{- end }}
